{% extends 'layouts/public_base.html' %}
{% load static %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your GoalFlex account</p>
        
        <div id="result" class="message is-hidden"></div>
        
        <form id="loginForm" method="post" action="{% url 'login_page' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="show-password-toggle">
                <label for="show-password-toggle">Show Password</label>
            </div>
            
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <p class="auth-link">
            <a href="#">Forgot Password?</a>
        </p>
        <p class="auth-link">
            Don't have an account? <a href="{% url 'register_page' %}">Register now</a>
        </p>
    </div>
</div>

<script>
// Show Password Toggle
const passwordInput = document.getElementById('password');
const showPasswordCheckbox = document.getElementById('show-password-toggle');

showPasswordCheckbox.addEventListener('change', function() {
    passwordInput.type = this.checked ? 'text' : 'password';
});

// Form Submission with Fetch
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const resultDiv = document.getElementById('result');
    const submitButton = this.querySelector('button[type="submit"]');
    
    submitButton.disabled = true;
    submitButton.textContent = 'Logging In...';
    resultDiv.classList.add('is-hidden');
    
    try {
        const response = await fetch('/api/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            resultDiv.textContent = data.message || 'Login successful!';
            resultDiv.className = 'message message-success';
            resultDiv.classList.remove('is-hidden');
            localStorage.setItem('token', data.token);
            
            // Check for user profile
            const profileResponse = await fetch('/api/user-profile/', {
                headers: {
                    'Authorization': `Token ${data.token}`
                }
            });
            
            setTimeout(() => {
                window.location.href = profileResponse.ok ? "{% url 'dashboard_page' %}" : "{% url 'onboarding_page' %}";
            }, 1500);
            
        } else {
            submitButton.disabled = false;
            submitButton.textContent = 'Login';
            resultDiv.textContent = data.non_field_errors?.[0] || 'Invalid credentials!';
            resultDiv.className = 'message message-error';
            resultDiv.classList.remove('is-hidden');
        }
        
    } catch (error) {
        submitButton.disabled = false;
        submitButton.textContent = 'Login';
        resultDiv.textContent = 'Network error. Please try again.';
        resultDiv.className = 'message message-error';
        resultDiv.classList.remove('is-hidden');
    }
});
</script>
{% endblock %}
