{% extends 'layouts/public_base.html' %}
{% load static %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join GoalFlex and start your fitness journey</p>
        
        <div id="result" class="message is-hidden"></div>
        
        <form id="registerForm" method="post" action="{% url 'register_page' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
                <div id="password-strength-bar" class="strength-bar"></div>
                <div id="password-strength-text" class="strength-text is-hidden"></div>
            </div>
            
            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-control" placeholder="Confirm your password" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="show-password-toggle">
                <label for="show-password-toggle">Show Passwords</label>
            </div>
            
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        
        <p class="auth-link">
            Already have an account? <a href="{% url 'login_page' %}">Login here</a>
        </p>
    </div>
</div>

<script>
// Get CSRF Token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Password Show Toggle
const passwordInput = document.getElementById('password');
const passwordConfirmInput = document.getElementById('password_confirm');
const showPasswordCheckbox = document.getElementById('show-password-toggle');

showPasswordCheckbox.addEventListener('change', function() {
    const type = this.checked ? 'text' : 'password';
    passwordInput.type = type;
    passwordConfirmInput.type = type;
});

// Password Strength Meter
const strengthBar = document.getElementById('password-strength-bar');
const strengthText = document.getElementById('password-strength-text');

passwordInput.addEventListener('input', function() {
    const password = this.value;
    let strength = 0;
    if (password.length > 0) {
        strengthText.classList.remove('is-hidden');
    } else {
        strengthText.classList.add('is-hidden');
    }

    if (password.length >= 8) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^A-Za-z0-9]/)) strength++;

    let strengthLevel = '';
    let strengthColor = '';
    if (strength < 2) {
        strengthLevel = 'Very Weak';
        strengthColor = '#E05A5A';
    } else if (strength < 4) {
        strengthLevel = 'Moderate';
        strengthColor = '#D4AF37';
    } else {
        strengthLevel = 'Strong';
        strengthColor = '#4A8A62';
    }

    strengthBar.style.background = `linear-gradient(to right, ${strengthColor} ${(strength / 5) * 100}%, #2A3136 0%)`;
    strengthText.textContent = strengthLevel;
    strengthText.style.color = strengthColor;
});

// Form Submission
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('result');
    const submitButton = this.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = 'Registering...';
    resultDiv.classList.add('is-hidden');

    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password_confirm').value;

    if (password !== passwordConfirm) {
        resultDiv.textContent = 'Passwords do not match!';
        resultDiv.className = 'message message-error';
        resultDiv.classList.remove('is-hidden');
        submitButton.disabled = false;
        submitButton.textContent = 'Register';
        return;
    }

    try {
        const response = await fetch('/api/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            resultDiv.textContent = data.message;
            resultDiv.className = 'message message-success';
            resultDiv.classList.remove('is-hidden');
            localStorage.setItem('token', data.token);
            setTimeout(() => { window.location.href = "{% url 'login_page' %}"; }, 2000);
        } else {
            submitButton.disabled = false;
            submitButton.textContent = 'Register';
            const errorMsg = data.username?.[0] || data.email?.[0] || data.password?.[0] || data.message || 'An error occurred during registration.';
            resultDiv.textContent = errorMsg;
            resultDiv.className = 'message message-error';
            resultDiv.classList.remove('is-hidden');
        }
    } catch (error) {
        submitButton.disabled = false;
        submitButton.textContent = 'Register';
        resultDiv.textContent = 'Network error. Please try again.';
        resultDiv.className = 'message message-error';
        resultDiv.classList.remove('is-hidden');
    }
});
</script>
{% endblock %}
